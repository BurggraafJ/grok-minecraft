name: KitPvP
version: '${version}'
main: nl.burggraaf.mc.kitpvp.KitPvP
api-version: '${apiVersion}'
description: "KitPvP met een hub: modus kiezen (Story of Zelda: avontuur over eilanden; PvP Arena, PvP Castle), kitruimte, arena; kills/doden/reeksen, geen drops."
author: Minecraft Bot
softdepend: [Opmaak]
commands:
  kit:
    description: "Kies een kit (in een kitruimte)"
    aliases: [kits]
  modus:
    description: "Kies een modus (menu), of /modus <naam>"
    aliases: [modi]
  arena:
    description: "Terug naar de hub (buiten een gevecht). Console: /arena aftellen <s> | bouw | zelftest"
  stats:
    description: "Jouw KitPvP-statistieken"
    aliases: [kd]
  hint:
    description: "Story of Zelda: Wiske helpt je op weg"
  kitpvp:
    description: "Beheer: kitpvp zelftest | test <speler> | zelda [in|reset|rust|test|verder|vaar|vlag|hint] | bouw [hub|arena|kasteel|zelda|zelda-zee|alles] | kaart | status | aftellen <s>"
    permission: kitpvp.beheer
permissions:
  kitpvp.beheer:
    default: op
