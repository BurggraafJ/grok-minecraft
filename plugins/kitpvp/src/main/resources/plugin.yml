name: KitPvP
version: '${version}'
main: nl.burggraaf.mc.kitpvp.KitPvP
api-version: '${apiVersion}'
description: "KitPvP met een hub: modus kiezen (PvP Arena, PvP Castle), kitruimte, arena; kills/doden/reeksen, geen drops. Story of Zelda is een eigen plugin (Zelda)."
author: Minecraft Bot
softdepend: [Opmaak]
commands:
  kit:
    description: "Kies een kit (in een kitruimte)"
    aliases: [kits]
  modus:
    description: "Kies een modus (menu), of /modus <naam>"
    aliases: [modi]
  arena:
    description: "Terug naar de hub (buiten een gevecht). Console: /arena aftellen <s> | bouw | zelftest"
  stats:
    description: "Jouw KitPvP-statistieken"
    aliases: [kd]
  kitpvp:
    description: "Beheer: kitpvp zelftest | test <speler> | bouw [hub|arena|kasteel|alles] | kaart | status | aftellen <s> (kitpvp zelda … = zelda …, plugin Zelda)"
    permission: kitpvp.beheer
permissions:
  kitpvp.beheer:
    default: op
