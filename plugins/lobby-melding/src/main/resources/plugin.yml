name: LobbyMelding
version: '${version}'
main: nl.burggraaf.mc.lobbymelding.LobbyMelding
api-version: '${apiVersion}'
description: "De lobby van Burggraaf Craft: een grote tuin met poorten naar Survival en KitPvP, 10 parkour-levels, servermenu, veilig (geen schade of honger)."
author: Minecraft Bot
commands:
  lobbymelding:
    description: "/lobbymelding terug | wie-terug | info (console, door mc)"
    permission: lobbymelding.beheer
  spawn:
    description: "Terug naar de fontein in de tuin"
    aliases: [tuin]
    permission: lobbymelding.speler
  parkour:
    description: "/parkour reset = terug naar de start van je level (timer opnieuw); /parkour kies = level-kiezer"
    aliases: [parcours]
    permission: lobbymelding.speler
permissions:
  lobbymelding.beheer:
    default: op
  lobbymelding.speler:
    default: true
