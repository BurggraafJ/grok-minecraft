name: LobbyMelding
version: '${version}'
main: nl.burggraaf.mc.lobbymelding.LobbyMelding
api-version: '${apiVersion}'
description: "De lobby van Burggraaf Craft: een klein tuindorp met poorten naar Survival en KitPvP en tien parkour-levels; veilig (geen schade of honger)."
author: Minecraft Bot
commands:
  lobbymelding:
    description: "/lobbymelding info | zelftest | kaart | bouw | voortgang <speler> [n] | terug | wie-terug (console, door mc)"
    permission: lobbymelding.beheer
  spawn:
    description: "Terug naar de brink (de spawn)"
    aliases: [tuin]
    permission: lobbymelding.speler
  parkour:
    description: "/parkour = terug naar de start van je level; /parkour kies = level kiezen"
    aliases: [parcours]
    permission: lobbymelding.speler
permissions:
  lobbymelding.beheer:
    default: op
  lobbymelding.speler:
    default: true
